openapi: 3.0.3
info:
  title: Spoofy Test Store
  version: 1.4.2
  description: >
    A deliberately awkward spec used across Spoofy's tests. It exercises
    parameter inheritance, $ref indirection, format-driven generation, enums,
    constraints, spec-provided examples, and an operation with no operationId.

servers:
  - url: https://api.example.com/v1
  - url: http://localhost:8080/v1

paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [available, pending, sold]
        - name: X-Request-Id
          in: header
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{petId}:
    # Declared once on the path item and inherited by every operation below.
    # Spoofy must merge this in, or every request to these endpoints 404s.
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPet
      summary: Fetch one pet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Not found
    delete:
      operationId: deletePet
      summary: Delete a pet
      responses:
        "204":
          description: Deleted
    patch:
      # Deliberately has no operationId, so ID synthesis is covered.
      summary: Partially update a pet
      deprecated: true
      parameters:
        # Overrides the inherited petId with a stricter example.
        - name: petId
          in: path
          required: true
          example: "11111111-2222-3333-4444-555555555555"
          schema:
            type: string
        - name: dry_run
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: OK

  /pets/{petId}/photos:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listPhotos
      responses:
        "200":
          description: OK

  /admin/users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: OK

  /health:
    get:
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: OK

components:
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum: [available, pending, sold]
        weightKg:
          type: number
          minimum: 0.1
          maximum: 90
        tags:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        owner:
          $ref: "#/components/schemas/Owner"
        birthday:
          type: string
          format: date

    NewPet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          example: Mango
        species:
          type: string
          enum: [dog, cat, ferret]
        owner:
          $ref: "#/components/schemas/Owner"
        vaccinated:
          type: boolean
        microchip:
          type: string
          pattern: "^[0-9]{15}$"

    Owner:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        joinedAt:
          type: string
          format: date-time
