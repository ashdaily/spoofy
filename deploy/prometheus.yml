# Scrape config for the Spoofy demo stack.
#
# 5s rather than the usual 15s, so a demo shows a curve within a minute.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: spoofy
    static_configs:
      - targets: ["spoofy:9090"]
        labels:
          service: spoofy
